name: 'Terraform AWS'
description: 'GitHub Action to manage AWS infrastructure using Terraform with support for multiple environments and role assumption.'
inputs:
  environment:
    description: 'Environment whose tfvars file to use (e.g. development). Selects <environment>.tfvars.'
    required: true
  workspace:
    description: 'Terraform workspace to select/create (default: same as environment). Use to isolate state for a PR while reusing an environment''s tfvars.'
    required: false
    default: ''
  release-version:
    description: 'Release version for tagging resources (default: latest)'
    required: true
  working-directory:
    description: 'Terraform working directory (default: infrastructure)'
    required: false
    default: 'infrastructure'
  destroy:
    description: 'Whether to destroy the infrastructure instead of creating/updating it (default: false)'
    required: false
    default: 'false'
  apply:
    description: 'Whether to apply the Terraform plan (default: false)'
    required: false
    default: 'false'
  args:
    description: 'Additional arguments to pass to Terraform commands'
    required: false
    default: ''
  terraform-version:
    description: 'Terraform version to install (default: latest)'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Initialize Terraform
      run: |
        terraform init -input=false -upgrade
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Select Terraform workspace
      run: terraform workspace select -or-create ${{ inputs.workspace || inputs.environment }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Plan the infrastructure
      run: |
        terraform plan \
        -out=tfplan -input=false \
        -var-file="${{ inputs.environment }}.tfvars" \
        -var "aws_access_key=${{ env.AWS_ACCESS_KEY_ID }}" \
        -var "aws_secret_key=${{ env.AWS_SECRET_ACCESS_KEY }}" \
        -var "release_version=${{ inputs.release-version }}" \
        ${{ inputs.args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Destroy the infrastructure
      if: ${{ inputs.destroy == 'true' && inputs.apply != 'true' }}
      run: |
        terraform destroy -auto-approve -input=false \
        -var-file="${{ inputs.environment }}.tfvars" \
        -var "aws_access_key=${{ env.AWS_ACCESS_KEY_ID }}" \
        -var "aws_secret_key=${{ env.AWS_SECRET_ACCESS_KEY }}" \
        -var "release_version=${{ inputs.release-version }}" \
        ${{ inputs.args }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Apply the infrastructure from plan
      if: ${{ inputs.destroy != 'true' && inputs.apply == 'true' }}
      run: terraform apply -auto-approve tfplan
      shell: bash
      working-directory: ${{ inputs.working-directory }}