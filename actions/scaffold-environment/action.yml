name: Scaffold Deployment Environments
description: 'Scaffolds with Terraform configuration to create deployment environments and secrets'

inputs:
  repository:
    description: 'Name for the new repository (name only)'
    required: true
  token:
    description: 'GitHub Token with repo and workflow permissions'
    required: true
  variables:
    description: Content for Terraform variable files
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Create terraform.tfvars with inputs
      shell: bash
      run: |
        cat <<'EOF' > ${{ github.action_path }}/terraform.tfvars
        ${{inputs.variables}}
        EOF

    - name: Apply Terraform to Scaffold Repository
      uses: ./actions/terraform-apply
      with:
        working-directory: ${{ github.action_path }}
